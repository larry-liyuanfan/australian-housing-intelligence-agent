apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: housing-mq
  namespace: default
spec:
  scaleTargetRef:
    kind: Deployment
    name: housing-mq
  minReplicaCount: 0
  maxReplicaCount: 3
  triggers:
    - type: redis
      metadata:
        address: redis.redis.svc.cluster.local:6379
        listName: housing-posts
        listLength: "5"
