[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "australian-housing-intelligence-agent"
version = "0.1.0"
description = "Evidence-grounded Agentic Search for Australian housing discourse and official context"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
elasticsearch = ["elasticsearch>=8.15,<9"]
redis = ["redis>=5.2,<7"]
test = ["httpx>=0.28,<1", "pytest>=8.3,<10", "pytest-cov>=6,<8"]

[project.scripts]
housing-agent = "housing_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/housing_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
